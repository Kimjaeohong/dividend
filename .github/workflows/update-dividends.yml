name: Update US dividend data

on:
  schedule:
    # 매일 22:10 UTC = 한국시간 아침 07:10 (GitHub 사정으로 몇 시간 늦게 돌 때도 있음)
    - cron: '10 22 * * *'
  workflow_dispatch: {}
  # 국내 분기배당주 목록(kr_quarterly.json)을 손으로 고치면 CDN 캐시만 바로 비워줌
  push:
    branches: [main]
    paths:
      - 'data/kr_quarterly.json'

permissions:
  contents: write

# 수동 실행과 예약 실행이 겹쳐도 하나씩 차례로 돌게
concurrency:
  group: update-dividends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'

      - name: Install deps
        if: github.event_name != 'push'
        run: pip install --upgrade yfinance

      - name: Fetch dividend data
        if: github.event_name != 'push'
        run: python scripts/fetch_dividends.py

      - name: Commit & push if changed
        if: github.event_name != 'push'
        run: |
          git config user.name "dividend-bot"
          git config user.email "actions@github.com"
          git add data/us_dividends.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: update $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 실행 중에 kr_quarterly.json 등을 손으로 고쳤어도 push가 실패하지 않게
          git pull --rebase origin main
          git push

      - name: Purge jsDelivr cache
        # jsDelivr는 최대 12시간 옛 파일을 보여주므로, 갱신 직후 바로 반영되게 캐시를 비움
        run: |
          for f in us_dividends.json kr_quarterly.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/$f" > /dev/null \
              && echo "purged $f" || echo "purge failed: $f (다음 실행 때 다시 시도)"
          done
